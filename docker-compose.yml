services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${PIPELINE_DB_USER}
      MYSQL_PASSWORD: ${PIPELINE_DB_PASSWORD}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  db-bootstrap:
    image: mysql:8.0

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      DASHBOARD_DB_USER: ${DASHBOARD_DB_USER}
      DASHBOARD_DB_PASSWORD: ${DASHBOARD_DB_PASSWORD}

    entrypoint:
      - /bin/bash
      - -c
      - |
        mysql -h mysql -uroot -p"$${MYSQL_ROOT_PASSWORD}" <<SQL
        CREATE USER IF NOT EXISTS '$${DASHBOARD_DB_USER}'@'%'
          IDENTIFIED BY '$${DASHBOARD_DB_PASSWORD}';

        GRANT SELECT, SHOW VIEW
          ON \`$${MYSQL_DATABASE}\`.*
          TO '$${DASHBOARD_DB_USER}'@'%';
        SQL

  migration-assets:
    build: .
    image: steam-data-pipeline-app:local
    user: "0:0"

    command:
      - sh
      - -c
      - |
        rm -rf /flyway-migrations/*
        cp -a /app/db/migrations/. /flyway-migrations/

    volumes:
      - flyway_migrations:/flyway-migrations

  migrate:
    image: flyway/flyway:13.4.0-alpine
    command: migrate

    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      migration-assets:
        condition: service_completed_successfully

    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: ${PIPELINE_DB_USER}
      FLYWAY_PASSWORD: ${PIPELINE_DB_PASSWORD}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql

    volumes:
      - flyway_migrations:/flyway/sql:ro

  pipeline:
    profiles: ["manual"]
    build: .
    image: steam-data-pipeline-app:local

    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${PIPELINE_DB_USER}
      MYSQL_PASSWORD: ${PIPELINE_DB_PASSWORD}
      STEAMSPY_MODE: ${STEAMSPY_MODE:-all}
      STEAMSPY_PAGE: ${STEAMSPY_PAGE:-0}
      STEAM_TRACKED_APPIDS: ${STEAM_TRACKED_APPIDS:-730,427520,620}

  scheduler:
    build: .
    image: steam-data-pipeline-app:local
    restart: unless-stopped
    command: python src/scheduler.py

    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${PIPELINE_DB_USER}
      MYSQL_PASSWORD: ${PIPELINE_DB_PASSWORD}
      STEAMSPY_MODE: ${STEAMSPY_MODE:-all}
      STEAMSPY_PAGE: ${STEAMSPY_PAGE:-0}
      STEAM_TRACKED_APPIDS: ${STEAM_TRACKED_APPIDS:-730,427520,620}
      PIPELINE_TIMEZONE: ${PIPELINE_TIMEZONE:-Europe/Prague}
      PIPELINE_RUN_HOUR: ${PIPELINE_RUN_HOUR:-20}
      PIPELINE_RUN_MINUTE: ${PIPELINE_RUN_MINUTE:-0}
      PIPELINE_RUN_ON_STARTUP: ${PIPELINE_RUN_ON_STARTUP:-false}

  dashboard:
    build: .
    image: steam-data-pipeline-app:local
    restart: unless-stopped

    command: >
      streamlit run src/dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
      --browser.gatherUsageStats=false

    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${DASHBOARD_DB_USER}
      MYSQL_PASSWORD: ${DASHBOARD_DB_PASSWORD}

    ports:
      - "8501:8501"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  mysql_data:
  flyway_migrations:
