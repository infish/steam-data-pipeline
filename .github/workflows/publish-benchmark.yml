name: Publish benchmark image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build uniquely tagged benchmark image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/infish/steam-data-pipeline:benchmark-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
