name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build --tag steam-data-pipeline:test .

  integration-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: steam_pipeline_test
          MYSQL_USER: steam_pipeline
          MYSQL_PASSWORD: ci-pipeline-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: steam_pipeline_test
      MYSQL_USER: steam_pipeline
      MYSQL_PASSWORD: ci-pipeline-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply migrations
        run: >
          docker run --rm --network host
          -v "$PWD/db/migrations:/flyway/sql:ro"
          flyway/flyway:13.4.0-alpine
          -url="jdbc:mysql://127.0.0.1:3306/${MYSQL_DATABASE}?allowPublicKeyRetrieval=true&useSSL=false"
          -user="${MYSQL_USER}"
          -password="${MYSQL_PASSWORD}"
          -locations=filesystem:/flyway/sql
          migrate

      - name: Run integration tests
        env:
          INTEGRATION_DB: "1"
          PYTHONPATH: src
        run: python -m unittest discover -s tests/integration -t tests -v

      - name: Check the data dictionary is current
        env:
          PYTHONPATH: src
        run: python scripts/generate_data_dictionary.py --check
