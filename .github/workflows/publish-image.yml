name: Publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    # One publish at a time, in the order they started: a release tagged
    # minutes after another cannot have its `stable` move overtaken by the
    # older release finishing later. (GitHub keeps one waiting run per
    # group; a third run while one waits replaces it, so tag releases a few
    # minutes apart.)
    concurrency:
      group: publish-image
      cancel-in-progress: false
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Every tag, to compare this release with the others.
          fetch-depth: 0

      # `stable` moves only for a plain vX.Y.Z tag that is the highest
      # release: not for v1.3.0-rc.1, and not for a fix like v1.2.5 tagged
      # after v1.3.0, which would move the app back while its database
      # migrations cannot run backwards. The tag comes from the environment,
      # never pasted into the script.
      - name: Decide whether this release moves stable
        id: stable
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          highest="$(git tag --list 'v*' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)"

          if [[ "$GITHUB_REF" == refs/tags/* \
                && "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ \
                && "$tag" == "$highest" ]]; then
            echo "move=true" >> "$GITHUB_OUTPUT"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every build gets the full commit SHA tag; main also moves `latest`;
      # a vX.Y.Z git tag adds the matching vX.Y.Z image tag and, when it is
      # the highest release, moves `stable`, the tag the TrueNAS app follows
      # (its Update button pulls the newest release). latest=false stops release tags from also
      # moving `latest`.
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/infish/steam-data-pipeline
          flavor: |
            latest=false
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=raw,value=stable,enable=${{ steps.stable.outputs.move == 'true' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
