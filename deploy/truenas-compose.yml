services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: CHANGE_ME_ROOT
      MYSQL_DATABASE: steam_pipeline
      MYSQL_USER: pipeline
      MYSQL_PASSWORD: CHANGE_ME_PIPELINE

    volumes:
      - /mnt/Apps/steam-data-pipeline/mysql:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h 127.0.0.1 -u root --silent',
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  db-bootstrap:
    image: mysql:8.0

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      MYSQL_PWD: CHANGE_ME_ROOT
      MYSQL_DATABASE: steam_pipeline
      PIPELINE_DB_USER: pipeline
      DASHBOARD_DB_USER: dashboard
      DASHBOARD_DB_PASSWORD: CHANGE_ME_DASHBOARD
      WRITER_DB_USER: writer
      WRITER_DB_PASSWORD: CHANGE_ME_WRITER

    entrypoint:
      - /bin/bash
      - -c
      - |
        set -euo pipefail

        # These values are interpolated into SQL below.
        for name in MYSQL_DATABASE DASHBOARD_DB_USER DASHBOARD_DB_PASSWORD \
                    WRITER_DB_USER WRITER_DB_PASSWORD; do
          if [[ ! "$${!name:-}" =~ ^[A-Za-z0-9_-]+$$ ]]; then
            echo "db-bootstrap: $$name must be set and match ^[A-Za-z0-9_-]+\$$" >&2
            exit 1
          fi
        done

        if [[ "$$WRITER_DB_USER" == "$${PIPELINE_DB_USER:-}" ||
              "$$WRITER_DB_USER" == "$$DASHBOARD_DB_USER" ]]; then
          echo "db-bootstrap: WRITER_DB_USER must differ from the schema owner and dashboard users" >&2
          exit 1
        fi

        mysql -h mysql -uroot <<SQL
        CREATE USER IF NOT EXISTS '$${DASHBOARD_DB_USER}'@'%'
          IDENTIFIED BY '$${DASHBOARD_DB_PASSWORD}';
        ALTER USER '$${DASHBOARD_DB_USER}'@'%'
          IDENTIFIED BY '$${DASHBOARD_DB_PASSWORD}';
        GRANT SELECT, SHOW VIEW
          ON \`$${MYSQL_DATABASE}\`.*
          TO '$${DASHBOARD_DB_USER}'@'%';

        CREATE USER IF NOT EXISTS '$${WRITER_DB_USER}'@'%'
          IDENTIFIED BY '$${WRITER_DB_PASSWORD}';
        ALTER USER '$${WRITER_DB_USER}'@'%'
          IDENTIFIED BY '$${WRITER_DB_PASSWORD}';
        GRANT SELECT, INSERT, UPDATE
          ON \`$${MYSQL_DATABASE}\`.*
          TO '$${WRITER_DB_USER}'@'%';
        SQL

        echo "db-bootstrap: dashboard and writer accounts are up to date"

  migration-assets:
    image: ghcr.io/infish/steam-data-pipeline:latest
    user: "0:0"

    command:
      - sh
      - -c
      - |
        rm -rf /flyway-migrations/*
        cp -a /app/db/migrations/. /flyway-migrations/

    volumes:
      - flyway_migrations:/flyway-migrations

  migrate:
    image: flyway/flyway:13.4.0-alpine
    command: migrate

    depends_on:
      mysql:
        condition: service_healthy
      db-bootstrap:
        condition: service_completed_successfully
      migration-assets:
        condition: service_completed_successfully

    environment:
      FLYWAY_URL: jdbc:mysql://mysql:3306/steam_pipeline?allowPublicKeyRetrieval=true&useSSL=false
      FLYWAY_USER: pipeline
      FLYWAY_PASSWORD: CHANGE_ME_PIPELINE
      FLYWAY_LOCATIONS: filesystem:/flyway/sql

    volumes:
      - flyway_migrations:/flyway/sql:ro

  scheduler:
    image: ghcr.io/infish/steam-data-pipeline:latest
    restart: unless-stopped
    command: python src/scheduler.py

    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: steam_pipeline
      MYSQL_USER: writer
      MYSQL_PASSWORD: CHANGE_ME_WRITER
      STEAMSPY_MODE: all
      STEAMSPY_PAGE: "0"
      STEAM_TRACKED_APPIDS: "730,427520,620"
      PIPELINE_MAX_REJECTED_PERCENT: "5"

      PIPELINE_TIMEZONE: Europe/Prague
      PIPELINE_RUN_HOUR: "20"
      PIPELINE_RUN_MINUTE: "0"
      PIPELINE_RUN_ON_STARTUP: "false"

  pipeline:
    profiles: ["manual"]
    image: ghcr.io/infish/steam-data-pipeline:latest

    depends_on:
      migrate:
        condition: service_completed_successfully

    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: steam_pipeline
      MYSQL_USER: writer
      MYSQL_PASSWORD: CHANGE_ME_WRITER
      STEAMSPY_MODE: all
      STEAMSPY_PAGE: "0"
      STEAM_TRACKED_APPIDS: "730,427520,620"
      PIPELINE_MAX_REJECTED_PERCENT: "5"

  dashboard:
    image: ghcr.io/infish/steam-data-pipeline:latest
    restart: unless-stopped

    command: >
      streamlit run src/dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
      --browser.gatherUsageStats=false

    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: steam_pipeline
      MYSQL_USER: dashboard
      MYSQL_PASSWORD: CHANGE_ME_DASHBOARD

    ports:
      - "8501:8501"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  flyway_migrations:
